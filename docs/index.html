<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Union Trading (demo)</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="demo-badge" href="https://github.com/fcavichiolle/union-trading" title="Demonstração da interface"><span class="dot"></span>Demo</a>
<div class="login-page">

    <div class="login-fx" aria-hidden="true">
        <div class="login-steam">
            <i style="left:14%; bottom:-80px;  width:220px; height:300px; background:rgba(233,226,209,.30); animation:ut-steam 13s ease-in-out infinite;"></i>
            <i style="left:40%; bottom:-120px; width:260px; height:340px; background:rgba(122,214,163,.22); animation:ut-steam 17s ease-in-out 3s infinite;"></i>
            <i style="left:64%; bottom:-60px;  width:200px; height:280px; background:rgba(196,138,84,.26); animation:ut-steam 15s ease-in-out 6s infinite;"></i>
            <i style="left:82%; bottom:-140px; width:300px; height:360px; background:rgba(233,226,209,.20); animation:ut-steam 19s ease-in-out 9s infinite;"></i>
            <i style="left:4%;  top:20%; width:340px; height:340px; background:rgba(10,53,33,.5);  animation:ut-drift 24s ease-in-out infinite;"></i>
            <i style="right:6%; top:8%;  width:300px; height:300px; background:rgba(59,36,21,.55); animation:ut-drift 28s ease-in-out 4s infinite;"></i>
        </div>
        <div class="login-bean" style="left:3%;  width:24px; opacity:.85; animation:ut-fall 11s   linear -2s  infinite;"><svg viewBox="0 0 24 32" width="24" height="32"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#6B4327"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:10%; width:18px; opacity:.6;  animation:ut-fall 15s   linear -9s  infinite;"><svg viewBox="0 0 24 32" width="18" height="24"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#5C3720"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:19%; width:30px; opacity:.9;  animation:ut-fall 13s   linear -5s  infinite;"><svg viewBox="0 0 24 32" width="30" height="40"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#7A4E2E"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:27%; width:20px; opacity:.55; animation:ut-fall 17s   linear -13s infinite;"><svg viewBox="0 0 24 32" width="20" height="27"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#6B4327"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:36%; width:26px; opacity:.85; animation:ut-fall 12s   linear -7s  infinite;"><svg viewBox="0 0 24 32" width="26" height="35"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#5C3720"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:45%; width:16px; opacity:.5;  animation:ut-fall 19s   linear -3s  infinite;"><svg viewBox="0 0 24 32" width="16" height="21"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#7A4E2E"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:54%; width:30px; opacity:.9;  animation:ut-fall 14s   linear -11s infinite;"><svg viewBox="0 0 24 32" width="30" height="40"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#4A2C1A"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:63%; width:20px; opacity:.6;  animation:ut-fall 16s   linear -1s  infinite;"><svg viewBox="0 0 24 32" width="20" height="27"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#6B4327"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:72%; width:27px; opacity:.85; animation:ut-fall 12.5s linear -8s  infinite;"><svg viewBox="0 0 24 32" width="27" height="36"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#5C3720"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:81%; width:22px; opacity:.7;  animation:ut-fall 18s   linear -15s infinite;"><svg viewBox="0 0 24 32" width="22" height="29"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#7A4E2E"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
        <div class="login-bean" style="left:90%; width:19px; opacity:.6;  animation:ut-fall 15s   linear -6s  infinite;"><svg viewBox="0 0 24 32" width="19" height="25"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#6B4327"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#22120A" stroke-width="1.7" fill="none"></path></svg></div>
    </div>

    <form class="login-card" action="inicio.html" method="get">
        <div class="login-head">
            <div class="login-brandtile">
                <img src="assets/union-trading.png" alt="Union Trading" class="logo-union">
            </div>
            <div>
                <h1 class="login-title">Bem-vindo de volta</h1>
                <p class="login-sub">Acesse sua conta Union Trading</p>
            </div>
        </div>

        <div class="login-fields">
            <label class="login-field">
                <span class="lbl">E-mail</span>
                <span class="login-inputwrap">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(251,248,241,.6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"></rect><path d="m4 7 8 6 8-6"></path></svg>
                    <input type="email" value="admin@utrading.com.br" placeholder="nome@utrading.com.br">
                </span>
            </label>
            <label class="login-field">
                <span class="lbl">Senha</span>
                <span class="login-inputwrap">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(251,248,241,.6)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path></svg>
                    <input type="password" value="demo1234" placeholder="••••••••">
                </span>
            </label>
        </div>

        <div class="login-row">
            <label class="login-check">
                <input type="checkbox" checked>
                <span class="box"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F7F3EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"></path></svg></span>
                <span>Manter-me conectado</span>
            </label>
            <a href="#" class="login-forgot">Esqueci minha senha</a>
        </div>

        <button type="submit" class="login-btn">
            <span>Entrar</span>
            <span class="bean"><svg viewBox="0 0 24 32" width="16" height="21"><ellipse cx="12" cy="16" rx="10.5" ry="15" fill="#E9E2D1"></ellipse><path d="M12 2.5c3.2 6 3.2 21.5 0 27" stroke="#0A3A22" stroke-width="2.2" fill="none"></path></svg></span>
        </button>

        <p class="login-foot">Acessos criados somente por administradores · Sem cadastro público</p>
    </form>
</div>
</body>
</html>
